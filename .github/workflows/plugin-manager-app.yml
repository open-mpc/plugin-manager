# The Plugin Manager app (an addin: the mode slot shim + the daemon, modeslot/package_app.sh) as a DRAFT release
# (plugin-manager-app-v<version>) for a person to check on a device and publish. Gen2 (aarch64) only for now: the Gen1 MPC and
# Force builds are tested offline and on the real binaries under emulation, not on hardware (modeslot/README.md).
# Start with dry_run: the zip comes as a run artifact. The tools come from open-mpc/mpc-vst-plugins at TOOLS_REF.
name: Plugin Manager app
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 2.1.0 (must equal PM_VERSION in src/manager.c)
        required: true
      dry_run:
        description: Build and package only (the zip as a run artifact), no draft release
        type: boolean
        default: true
permissions:
  contents: read
env:
  TOOLS_REF: 97480b2760b71a1706be66ee040a5720b0bbe0ee
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      TAG: plugin-manager-app-v${{ inputs.version }}
      MPC_VST: ${{ github.workspace }}/.mpc-vst-plugins
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: open-mpc/mpc-vst-plugins
          ref: ${{ env.TOOLS_REF }}
          path: .mpc-vst-plugins
      - name: The version is the Manager's
        run: |
          v=$(sed -n 's/^#define PM_VERSION "\(.*\)"/\1/p' src/manager.c)
          [ "$v" = "$VERSION" ] || { echo "::error::PM_VERSION is $v but the release version is $VERSION"; exit 1; }
      - name: Refuse to touch a published release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | if .draft then \"draft\" else \"published\" end" | head -1)
          echo "existing release for $TAG: ${state:-none}"
          [ "$state" != published ] || { echo "::error::$TAG is already published - bump the version"; exit 1; }
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Build the Manager (daemon, skins, page table)
        run: vst/build_themes.sh aarch64
      - name: Pillow (modeslot/make_page.py draws the page and the icon)
        run: python3 -m pip install --quiet pillow
      - name: Package the app (shim tests under qemu, then release_addin.py)
        run: modeslot/package_app.sh "$PWD/dist" aarch64
      - name: Catalog conformance
        run: |
          set -e
          for z in dist/*.zip; do python3 "$MPC_VST/tools/catalog_check.py" "$z" --catalog --expect-id pm-app --expect-repo "$GITHUB_REPOSITORY"; done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TAG }}
          path: dist/*.zip
          retention-days: 14
      - name: Create or update the draft release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          The Open MPC Plugin Manager as an app: a Plugin Manager tile in MENU, full screen, and the web page on port 8790, without the plugin. MPC OS 3.10.1, Gen2 (MPC Live III, One G2, Key G2, XL).

          Patches MPC while it loads (a library preloaded into MPC; it checks the exact MPC build first and changes nothing on any other). Install it from the Plugin Manager's add-ins list, which also installs Addin Restore so it comes back after a reboot.

          Uninstalling and the file list are in \`INSTALL.md\` inside the zip.

          ---
          Built by GitHub Actions from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7} with mpc-vst-plugins@${TOOLS_REF::7}.
          NOTES
          sed -i 's/^ *//' notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
            gh release edit "$TAG" --draft --target "$GITHUB_SHA" --title "Plugin Manager App v$VERSION" --notes-file notes.md
          else
            gh release create "$TAG" dist/*.zip --draft --target "$GITHUB_SHA" --title "Plugin Manager App v$VERSION" --notes-file notes.md
          fi
